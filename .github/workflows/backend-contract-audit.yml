name: Backend contract audit (diagnostic, not acceptance)
on:
  push:
    branches: [audit/backend-contracts-20260920]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - run: npm ci
      - name: Reproduce backend boundaries against unchanged application code
        run: npx tsx tools/backend-contract-audit.ts
      - name: Record meaning of this run
        if: always()
        run: echo 'This is an isolated diagnostic audit. Some probes reproduce defects. Success is NOT application acceptance or real-LLM conversation evidence. No live models or application secrets are used.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: backend-contract-audit-${{ github.run_id }}
          path: artifacts/backend-contract-audit.json
          retention-days: 7
          if-no-files-found: warn
