name: Bootstrap dependency lock (one time)
on:
  push:
    branches: [feat/session-runtime]
    paths: [package.json, .github/workflows/bootstrap-lock.yml]
permissions:
  contents: write
concurrency:
  group: bootstrap-session-lock
  cancel-in-progress: false
jobs:
  lock:
    if: github.ref == 'refs/heads/feat/session-runtime' && github.repository == 'cer12u/multi-llm-session'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Resolve exact published versions and commit only package metadata
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json; then echo 'Lock already exists; no changes.'; exit 0; fi
          npm install --package-lock-only --ignore-scripts --save-exact fastify better-sqlite3 zod react react-dom fast-xml-parser
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact typescript @types/node@24 @types/react @types/react-dom @types/better-sqlite3 vite vitest @playwright/test tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          git commit -m 'build: lock exact published dependencies for session runtime'
          git push origin HEAD:feat/session-runtime
          cat package.json
