name: Session application CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: session-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    outputs:
      diagnostic: ${{ steps.e2e.outputs.diagnostic || steps.browser.outputs.diagnostic || steps.lab.outputs.diagnostic || steps.schemas.outputs.diagnostic || steps.build.outputs.diagnostic || steps.tests.outputs.diagnostic || steps.typecheck.outputs.diagnostic || steps.install.outputs.diagnostic }}
      counts: ${{ steps.tests.outputs.counts }}
      failures: ${{ steps.e2e.outputs.failures || steps.browser.outputs.failures || steps.lab.outputs.failures || steps.schemas.outputs.failures || steps.build.outputs.failures || steps.tests.outputs.failures || steps.typecheck.outputs.failures || steps.install.outputs.failures || steps.tests.outputs.countsJson }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install locked dependencies
        id: install
        run: node deploy/ci-check.mjs install
      - name: TypeScript checking
        id: typecheck
        run: node deploy/ci-check.mjs typecheck
      - name: Unit, transaction, recovery, privacy and HTTP tests
        id: tests
        run: node deploy/ci-check.mjs tests
      - name: Production build
        id: build
        run: node deploy/ci-check.mjs build
      - name: Export contract schemas
        id: schemas
        run: node deploy/ci-check.mjs schemas
      - name: Three, five and eight independent worker processes
        id: lab
        run: node deploy/ci-check.mjs lab
      - name: Long model response, renewable lease and pause fencing E2E
        run: timeout --signal=TERM --kill-after=15s 450 node deploy/long-request-e2e.mjs
      - name: Install the locked Chromium browser
        id: browser
        run: node deploy/ci-check.mjs browser
      - name: Browser session lifecycle and reconnection
        id: e2e
        run: node deploy/ci-check.mjs e2e
      - name: Export reproducible source and test scope
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=tar HEAD | gzip > artifacts/source.tar.gz
          node -e "require('fs').writeFileSync('artifacts/commit.json', JSON.stringify({sha:process.env.GITHUB_SHA, mode:'mock', liveCalls:false},null,2))"
          echo 'Validation uses synthetic characters and mock models only; it is not a real LLM quality evaluation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: session-verification-${{ github.run_id }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
  verification-detail:
    needs: verify
    if: always()
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        detail: ${{ fromJSON(needs.verify.outputs.failures || '["No result; inspect verify job"]') }}
    name: "Diagnostic only — ${{ matrix.detail }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo 'The verify and container jobs remain authoritative. This job only displays bounded synthetic diagnostics; its success is not acceptance.'
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the non-root application image
        run: docker build -f deploy/Dockerfile -t multi-llm-session:ci .
      - name: Validate Compose and boot an isolated mock cluster
        run: |
          node deploy/init-env.mjs
          docker compose --env-file .env -f deploy/compose.yaml config --quiet
          docker compose --env-file .env -f deploy/compose.yaml up -d --no-build
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/healthz
          docker compose --env-file .env -f deploy/compose.yaml ps
          docker compose --env-file .env -f deploy/compose.yaml exec -T core node --input-type=module < deploy/smoke.mjs
      - name: Stop test containers
        if: always()
        run: docker compose --env-file .env -f deploy/compose.yaml down --volumes
