name: Synthetic operational soak
on:
  pull_request:
    branches: [main]
    paths: ['apps/**', 'packages/**', '.github/workflows/operational-soak.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operational-soak-${{ github.ref }}
  cancel-in-progress: true
jobs:
  operational-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Ten-minute actual Core and three Worker workload with restart
        run: node dist/apps/cli/soak.js 600 artifacts/operational-soak.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: operational-soak-${{ github.run_id }}
          path: artifacts/operational-soak.json
          retention-days: 7
          if-no-files-found: warn
