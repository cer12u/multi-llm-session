name: Multi-provider deployment acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deployment-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  multi-provider-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: docker build -f deploy/Dockerfile -t multi-llm-session:ci .
      - name: Non-root shared-model and heterogeneous HTTP Provider clusters
        run: node deploy/smoke-multiprovider.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: synthetic-deployment-${{ github.run_id }}
          path: artifacts/multiprovider-compose.json
          retention-days: 7
          if-no-files-found: warn
